      - competitor-analysis

  ml_engineer:
    display_name: "ML Engineer"
    description: "Model deployment, serving infrastructure, and production ML operations"
    focus: "Getting a trained model into production and keeping it healthy there"
    # Distinct from data_scientist (who trains it) and ai_engineer (who composes
    # someone else's model into a product). Shares only the mlai agent with the latter.

    primary_agents:
      - mlai
      - devops

    secondary_agents:
      - data
      - observability

    workflows:
      - production-ml-deployment
      - model-serving
      - mlops-pipeline-setup
      - ml-monitoring-observability
      - model-retraining-strategy
      - model-governance
      - model-evaluation
      - experiment-tracking-setup

    skills:
      - ml-deployment
      - mlops-pipeline-design
      - model-monitoring
      - model-evaluation
      - batch-vs-realtime-scoring
      - feature-store-design
      - data-versioning-reproducibility
      - deployment-rollback-strategies
      - kubernetes-resource-management

  ai_engineer:
    display_name: "AI Engineer"
    description: "LLM applications, RAG systems, agents, and evaluation harnesses"
    focus: "Composing a model you did not train into a product that behaves"
    # The model is a dependency this role does not control and cannot pin by
    # default, which is why evaluation and observability sit in the primary set
    # rather than being treated as follow-up work.
    #
    # Routes to `ai`, not `mlai`. The mlai prompt is the classical training
    # lifecycle — algorithm selection, hyperparameter tuning, drift detection —
    # and its eight subagents are all classical ML, so pointing this persona
    # there would have dragged model-training subagents into an LLM build and
    # contradicted the split that justifies a separate persona. (PRO-156)

    primary_agents:
      - ai
      - backend

    secondary_agents:
      - architect
      - test

    workflows:
      - llm-feature-build
      - rag-pipeline-setup
      - eval-harness-setup
      - prompt-iteration-cycle
      - api-design

    skills:
      - llm-application-architecture
      - prompt-engineering-practices
      - rag-system-design
      - vector-store-selection
      - llm-evaluation-and-testing
      - agent-tool-design
      - llm-safety-and-guardrails
      - llm-observability
      - multiagent-orchestration

  engineering_manager:
    display_name: "Engineering Manager"
    description: "Planning, prioritization, and team coordination"
    focus: "Sequencing the work and keeping the people unblocked"

    primary_agents:
      - plan
      - product

    secondary_agents:
      - orchestrator
      - architect

    workflows:
      - roadmap-planning
      - feature-prioritization
      - requirements-gathering
      - task-breakdown
      - strategy
      - decision-log
      - multi-agent-coordination

    skills:
      - team-collaboration
      - stakeholder-communication
      - requirements-specification
      - roadmap-prioritization
      - success-metrics-definition
      - problem-decomposition
      - technical-decision-making
      - feature-planning
      - post-implementation-checklist

