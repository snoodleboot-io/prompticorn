    focus: "Building scalable backend systems, APIs, and data persistence layers"
    
    # PRIMARY agents (core to this role)
    primary_agents:
      - code
      - test
      - refactor
      - migration
    
    # Secondary agents (supportive/cross-cutting)
    secondary_agents:
      - review
      - backend
      - performance
      - enforcement
      - atdd
    
    # Key workflows for this persona
    workflows:
      - code
      - testing
      - feature
