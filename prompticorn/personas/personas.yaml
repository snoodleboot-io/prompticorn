# Persona-Based Agent Mappings
# Reference: planning/current/adrs/ADR-001-persona-based-filtering.md
#
# This file defines which agents each persona (SDLC role) enables. Users select
# personas during initialization, and the build emits only those agents — plus
# the universal ones — and whatever skills and workflows those agents map in
# configurations/agent_skill_mapping.yaml (and language_skill_mapping.yaml).
#
# Personas deliberately do NOT list skills or workflows. They used to; the lists
# were never read by the build, drifted for months, and hid three dangling refs.
# Content reachability is the agents' job, and is enforced by
# tests/unit/test_content_reachability.py and the persona coverage matrix in
# tests/integration/test_persona_coverage_matrix.py. (PRO-153)

# Universal agents - always available to all personas
universal_agents:
  - ask        # General Q&A and research
  - debug      # Troubleshooting and error resolution
  - explain    # Code walkthroughs and onboarding
  - plan       # Strategic planning and work planning
  - orchestrator  # Multi-step workflow coordination

# Persona definitions
personas:
  backend_software_engineer:
    display_name: "Backend Software Engineer"
    description: "Backend development, APIs, microservices, and distributed systems"
    focus: "Building scalable backend systems, APIs, and data persistence layers"
    
    # PRIMARY agents (core to this role)
    primary_agents:
      - code
      - test
      - refactor
      - migration
    
    # Secondary agents (supportive/cross-cutting)
    secondary_agents:
      - review
      - backend
      - performance
      - enforcement
      - atdd
    
  frontend_software_engineer:
    display_name: "Frontend Software Engineer"
    description: "Frontend development, UI/UX, and accessible web experiences"
    focus: "Building performant, accessible user interfaces for web and mobile"
    
    # PRIMARY agents (core to this role)
    primary_agents:
      - code
      - test
      - refactor
      - migration
    
    # Secondary agents (supportive/cross-cutting)
    secondary_agents:
      - review
      - frontend
      - performance
      - enforcement
      - atdd
    
  fullstack_software_engineer:
    display_name: "Fullstack Software Engineer"
    description: "Full-stack development across frontend and backend"
    focus: "Building complete applications from UI to API to database"
    
    # PRIMARY agents (core to this role)
    primary_agents:
      - code
      - test
      - refactor
      - migration
    
    # Secondary agents (supportive/cross-cutting)
    secondary_agents:
      - review
      - backend
      - frontend
      - performance
      - enforcement
      - atdd
    
  software_engineer:
    display_name: "Software Engineer (Fullstack)"
    description: "Alias for Fullstack Software Engineer - deprecated, use fullstack_software_engineer"
    focus: "Building complete applications from UI to API to database"
    
    # PRIMARY agents (core to this role)
    primary_agents:
      - code
      - test
      - refactor
      - migration
    
    # Secondary agents (supportive/cross-cutting)
    secondary_agents:
      - review
      - backend
      - frontend
      - performance
      - enforcement
      - atdd
    
  architect:
    display_name: "Architect"
    description: "System design, architecture planning, and technical decisions"
    focus: "Designing scalable systems and making architectural trade-offs"
    
    primary_agents:
      - architect
      - backend
      - frontend
      - data
    
    secondary_agents:
      - performance
    
  qa_tester:
    display_name: "QA / Tester"
    description: "Quality assurance, testing strategy, and test automation"
    focus: "Ensuring quality through comprehensive testing"
    
    primary_agents:
      - qa-tester
      - test
      - review
      - atdd

    secondary_agents:
      - performance
      - enforcement
    
  devops_engineer:
    display_name: "DevOps Engineer"
    description: "Infrastructure, deployment, operations, and CI/CD"
    focus: "Building infrastructure as code and maintaining systems"
    
    primary_agents:
      - code         # Infrastructure-as-Code
      - devops
      - observability
      - incident
    
    # mlai and data were secondary here and brought 29 skills this role does
    # not do — cross-validation, ensemble methods, dimensionality reduction,
    # dimensional modelling, slowly-changing-dimensions. The two that were
    # genuinely operational (managed-database-selection, object-storage-patterns)
    # now sit on the devops agent itself, which is where they belong. (PRO-162)
    secondary_agents:
      - security

  security_engineer:
    display_name: "Security Engineer"
    description: "Security hardening, threat modeling, and compliance"
    focus: "Securing systems and meeting compliance requirements"
    
    primary_agents:
      - security
      - compliance
    
    secondary_agents:
      - incident
      - review
      - enforcement
    
  product_manager:
    display_name: "Product Manager"
    description: "Requirements, prioritization, and roadmap planning"
    focus: "Defining what to build and why"
    
    primary_agents:
      - product
    
    secondary_agents: []
    
  data_engineer:
    display_name: "Data Engineer"
    description: "Data pipelines, data quality, and data infrastructure"
    focus: "Building reliable data systems and ETL pipelines"
    
    primary_agents:
      - code         # ETL and pipeline code
      - data
    
    # mlai was secondary and brought 15 modelling skills this role does not do
    # — cross-validation, ensembles, hyperparameter optimization, model
    # interpretability. Data engineers build the pipelines; data_scientist and
    # ml_engineer own the modelling and both have mlai already. The two that
    # are genuinely pipeline work (feature-engineering, time-series-preprocessing)
    # moved onto the data agent. (PRO-162)
    secondary_agents:
      - devops
      - observability
      - performance

  data_scientist:
    display_name: "Data Scientist"
    description: "Machine learning, model development, and optimization"
    focus: "Building and improving ML/AI systems"
    
    primary_agents:
      - code         # ML model code
      - mlai
    
    secondary_agents:
      - data
      - test
      - performance
      - devops
      - observability
    
  technical_writer:
    display_name: "Technical Writer"
    description: "Documentation and technical communication"
    focus: "Creating clear, comprehensive documentation"
    
    primary_agents:
      - document
    
    secondary_agents: []
    
  # ==========================================================================
  # Discipline personas (PRO-155)
  #
  # Each lists only content its own agents can reach through
  # agent_skill_mapping.yaml — the persona narrows that set, it never adds to
  # it. Subagents are deliberately absent: they inherit their parent agent's
  # enabled status, so listing them here would be a second, drifting source of
  # truth. The "brings" note on each persona records which subagents ride
  # along, since that is the part a reader cannot see from the agent list.
  # ==========================================================================

  sre:
    display_name: "Site Reliability Engineer"
    description: "Service reliability, incident response, and production operations"
    focus: "Keeping production within its error budget, and learning from it when it is not"
    # brings: incident/{log-analysis,root-cause,rubber-duck}, observability/{dashboards,...}

    primary_agents:
      - incident
      - observability
      - performance

    secondary_agents:
      - devops

  platform_engineer:
    display_name: "Platform Engineer"
    description: "Cloud infrastructure, CI/CD, and the internal developer platform"
    focus: "Making the paved road faster than going around it"
    # brings: devops/{aws,docker,gitops,kubernetes,terraform-deployment}

    primary_agents:
      - devops
      - architect

    secondary_agents:
      - code

  appsec_engineer:
    display_name: "Application Security Engineer"
    description: "Secure code, threat modeling, and vulnerability management"
    focus: "Finding the flaw before it ships, not after it is exploited"
    # brings: security/{threat-model,compliance-auditor,...}, compliance/{gdpr,soc2,review}

    primary_agents:
      - security
      - review

    secondary_agents:
      - enforcement
      - compliance

  performance_engineer:
    display_name: "Performance Engineer"
    description: "Profiling, load testing, and latency optimization"
    focus: "Making it measurably faster, with the measurement first"
    # Note: the performance agent was secondary to eight personas and primary to
    # none before this persona existed.

    primary_agents:
      - performance

    secondary_agents:
      - backend
      - frontend
      - observability

  database_engineer:
    display_name: "Database Engineer"
    description: "Data modeling, query performance, and schema evolution"
    focus: "Designing storage that survives the second year"
    # brings: data/{governance,pipeline,quality,streaming,warehouse}

    primary_agents:
      - data
      - architect

    secondary_agents:
      - backend
      - migration

  ux_designer:
    display_name: "UX Designer"
    description: "User research, interaction design, and design systems"
    focus: "Designing what users can actually use, then checking that they can"
    # brings: frontend/{accessibility,mobile,react-patterns,vue-patterns}

    primary_agents:
      - frontend
      - product

    secondary_agents: []

  ml_engineer:
    display_name: "ML Engineer"
    description: "Model deployment, serving infrastructure, and production ML operations"
    focus: "Getting a trained model into production and keeping it healthy there"
    # Distinct from data_scientist (who trains it) and ai_engineer (who composes
    # someone else's model into a product). Shares only the mlai agent with the latter.

    primary_agents:
      - mlai
      - devops

    secondary_agents:
      - data
      - observability

  ai_engineer:
    display_name: "AI Engineer"
    description: "LLM applications, RAG systems, agents, and evaluation harnesses"
    focus: "Composing a model you did not train into a product that behaves"
    # The model is a dependency this role does not control and cannot pin by
    # default, which is why evaluation and observability sit in the primary set
    # rather than being treated as follow-up work.
    #
    # Routes to `ai`, not `mlai`. The mlai prompt is the classical training
    # lifecycle — algorithm selection, hyperparameter tuning, drift detection —
    # and its eight subagents are all classical ML, so pointing this persona
    # there would have dragged model-training subagents into an LLM build and
    # contradicted the split that justifies a separate persona. (PRO-156)

    primary_agents:
      - ai
      - backend

    secondary_agents:
      - architect
      - test

  engineering_manager:
    display_name: "Engineering Manager"
    description: "Planning, prioritization, technical debt, and team coordination"
    focus: "Sequencing the work and keeping the people unblocked"
    # `plan` and `orchestrator` are universal agents — always enabled for every
    # persona — so listing them here selected nothing and left this persona
    # differentiating on product+architect alone, a near-duplicate of picking
    # product_manager and architect together. Replaced with agents it genuinely
    # owns: refactor carries technical-debt-management, which this role lives
    # in and which PRO-155 had to leave out for exactly this reason. (PRO-162)

    primary_agents:
      - product
      - architect

    secondary_agents:
      - refactor
      - document

