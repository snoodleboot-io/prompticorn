name: Deploy Website to Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: https://prompticorn.com
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # projectName is `prompticorn-site`, not `prompticorn` (PRO-150).
      #
      # Every run from 2026-05-15 failed with 8000007 "Project not found"
      # because the name was wrong. Confirmed by fetching both:
      # prompticorn-site.pages.dev and www.prompticorn.com serve the same
      # bytes, differing only by the bot-management script Cloudflare injects
      # on a custom domain.
      #
      # website/wrangler.jsonc is a red herring — added in the same May commit
      # that broke this, describing a Workers deploy that was never the thing
      # serving the site.
      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: prompticorn-site
          directory: website
          gitHubToken: ${{ github.token }}
